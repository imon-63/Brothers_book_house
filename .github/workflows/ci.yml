name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
    inputs:
      force_all:
        description: Run every job regardless of changed paths (used by deploy.yml)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # workflow_call runs inherit the caller's context → keep the group distinct
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ inputs.force_all || steps.filter.outputs.backend }}
      frontend: ${{ inputs.force_all || steps.filter.outputs.frontend }}
      ops: ${{ inputs.force_all || steps.filter.outputs.ops }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            ops:
              - 'docker-compose*.yml'
              - '.env.example'
              - 'Makefile'
              - 'ops/**'
              - '.github/workflows/**'

  backend:
    name: Backend · lint, typecheck, unit + e2e
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cholo
          POSTGRES_PASSWORD: cholo
          POSTGRES_DB: cholo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cholo -d cholo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cholo:cholo@localhost:5432/cholo_test?schema=public
      DIRECT_URL: postgresql://cholo:cholo@localhost:5432/cholo_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OTEL_ENABLED: "false"
      LOG_LEVEL: warn
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prisma validate + generate
        run: npx prisma validate && npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (coverage)
        run: npm run test:cov -- --ci --passWithNoTests
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Seed (twice — must be idempotent)
        run: npx prisma db seed && npx prisma db seed
      - name: E2E tests
        run: npm run test:e2e -- --ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · typecheck + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  ops:
    name: Ops · compose + observability config
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config (prod + dev overlay)
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml --profile seed --profile logs config -q
          docker compose -f docker-compose.observability.yml config -q
          docker compose -f docker-compose.local.yml config -q
      - name: promtool check config + rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.local.yml
      - name: otelcol validate
        run: |
          docker run --rm -e DEPLOY_ENV=ci -e TRACE_SAMPLE_PCT=25 -v "$PWD/ops/otel-collector:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.120.0 validate --config=/cfg/config.yaml
      - name: Dashboards are valid JSON and up to date with the generator
        run: |
          for f in ops/grafana/dashboards/*.json; do jq -e '.uid and .panels' "$f" > /dev/null || exit 1; done
          node ops/grafana/generate-dashboards.js && git diff --exit-code ops/grafana/dashboards
      - name: Shell scripts
        run: shellcheck -S warning ops/deploy/*.sh ops/backup/*.sh

  docker:
    name: Docker build · ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            changed: backend
          - image: web
            context: frontend
            changed: frontend
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.changed] == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs[matrix.changed] == 'true'
      - name: Build (no push)
        if: needs.changes.outputs[matrix.changed] == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
