name: Deploy

# push to main → CI → build & push images to GHCR → SSH deploy to the server
# (with automatic rollback). Manual runs can pick the environment and, to roll
# back / redeploy, an existing image tag (skips CI + build).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to
        type: choice
        options: [production, staging]
        default: production
      image_tag:
        description: Existing image tag to (re)deploy, e.g. sha-1a2b3c4 — leave empty to build the current commit
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false # never interrupt a half-finished deploy

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  build:
    name: Build & push · ${{ matrix.image }}
    needs: ci
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: cholo-api
            context: backend
          - image: cholo-web
            context: frontend
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute names
        id: vars
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  deploy:
    name: Deploy · ${{ inputs.environment || 'production' }}
    needs: build
    # run after a successful build, or directly for a manual image_tag redeploy
    if: ${{ always() && (needs.build.result == 'success' || (inputs.image_tag && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers for this environment in
    # Settings → Environments → production → "Required reviewers".
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<CFG
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG

      - name: Render .env
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "${{ secrets.PROD_ENV_FILE }}" > .env.deploy
          # pipeline-owned keys always win over the secret's values
          sed -i '/^\(API_IMAGE\|WEB_IMAGE\|IMAGE_TAG\|DEPLOY_ENV\)=/d' .env.deploy
          {
            echo "API_IMAGE=ghcr.io/${owner}/cholo-api"
            echo "WEB_IMAGE=ghcr.io/${owner}/cholo-web"
            echo "IMAGE_TAG=${TAG}"
            echo "DEPLOY_ENV=${{ inputs.environment || 'production' }}"
          } >> .env.deploy
          grep -q '^POSTGRES_PASSWORD=' .env.deploy || { echo "PROD_ENV_FILE is missing POSTGRES_PASSWORD"; exit 1; }
          grep -q '^JWT_ACCESS_SECRET=' .env.deploy || { echo "PROD_ENV_FILE is missing JWT_ACCESS_SECRET"; exit 1; }

      - name: Upload compose files + ops config
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete-after -e ssh \
            --exclude 'nginx/certs/' --exclude 'backups/' \
            ops/ "deploy:$DEPLOY_PATH/ops/"
          rsync -az -e ssh docker-compose.yml "deploy:$DEPLOY_PATH/docker-compose.yml"
          # keep the server's IMAGE_TAG (current) until remote-deploy.sh switches it
          current_tag="$(ssh deploy "cat '$DEPLOY_PATH/.deploy/current_tag' 2>/dev/null" || true)"
          [ -n "$current_tag" ] && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${current_tag}|" .env.deploy
          rsync -az --chmod=F600 -e ssh .env.deploy "deploy:$DEPLOY_PATH/.env"
          rm -f .env.deploy

      - name: Log in to GHCR on the server
        run: |
          # a read:packages PAT survives beyond this job (needed if the server re-pulls later);
          # falls back to this run's GITHUB_TOKEN.
          user='${{ secrets.GHCR_PULL_USER || github.actor }}'
          echo '${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}' | ssh deploy "docker login ghcr.io -u '$user' --password-stdin" >/dev/null

      - name: Deploy (migrate → up → health → rollback on failure)
        run: ssh deploy "cd '$DEPLOY_PATH' && bash ops/deploy/remote-deploy.sh '$TAG'"

      - name: Smoke test through the public URL
        if: ${{ vars.PUBLIC_URL != '' }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.PUBLIC_URL }}/api/v1/health/ready" && exit 0
            sleep 6
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo "- environment: \`${{ inputs.environment || 'production' }}\`"
            echo "- image tag: \`${TAG}\`"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
