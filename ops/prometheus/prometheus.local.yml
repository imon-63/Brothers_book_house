# Prometheus for LOCAL mode (docker-compose.observability.yml):
# the API runs on the host (`npm run start:dev`) and exposes :9464/metrics.
global:
  scrape_interval: 5s      # real-time dashboards (5s refresh)
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    cluster: cholo-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cholo-api            # same job name as production → same dashboards/rules
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          instance: host-api

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-health
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
