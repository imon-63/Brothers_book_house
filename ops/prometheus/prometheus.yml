# Prometheus — scrapes the API directly (source of truth for app metrics),
# the OTel collector (host metrics + OTLP-pushed metrics) and itself.
# Tempo remote-writes span metrics here (--web.enable-remote-write-receiver).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: cholo

rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager is optional: point this at yours (or Grafana alerting reads the same rules).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cholo-api
    metrics_path: /metrics
    # compose DNS round-robins over replicas (`docker compose up --scale api=2`)
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9464
        refresh_interval: 30s

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-health
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
