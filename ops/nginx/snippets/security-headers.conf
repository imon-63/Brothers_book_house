add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: storefront loads product images from rokomari/ghorerbazar/techjhuli/unsplash CDNs
# and posts to SSLCOMMERZ. Tighten once images move to our own object storage.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; form-action 'self' https://sandbox.sslcommerz.com https://securepay.sslcommerz.com; base-uri 'self'" always;
