# Shared routing for the HTTP and HTTPS server blocks.
include /etc/nginx/snippets/security-headers.conf;
limit_conn perip 100;

# ACME http-01 challenges (certbot --webroot -w /var/www/certbot)
location ^~ /.well-known/acme-challenge/ {
  root /var/www/certbot;
  default_type text/plain;
}

# ── API ──
# Strict limit ONLY where a password/OTP is submitted (brute-force protection).
# /auth/me, /auth/refresh and /auth/logout are called on every page view and
# fall through to the normal /api/ limit below.
location ~ ^/api/v1/auth/(login|register|password/) {
  limit_req zone=auth burst=10 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_api;
}
# payment gateway callbacks (IPN) can be slow on the gateway side
location ^~ /api/v1/payments/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_read_timeout 90s;
  proxy_pass http://cholo_api;
}
location ^~ /api/ {
  limit_req zone=api burst=100 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_api;
}
# user-uploaded media served by the API
location ^~ /uploads/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_api;
  expires 7d;
  add_header Cache-Control "public, max-age=604800" always;
  include /etc/nginx/snippets/security-headers.conf;
}
# never expose the Prometheus endpoint or health internals publicly
location = /metrics { return 404; }

# ── Grafana (sub-path; GF_SERVER_SERVE_FROM_SUB_PATH=true) ──
location /grafana/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_grafana;
}
location /grafana/api/live/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_read_timeout 1h;
  proxy_pass http://cholo_grafana;
}

# ── Next.js static assets: immutable, cache hard ──
location ^~ /_next/static/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_web;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# ── storefront + admin ──
location / {
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass http://cholo_web;
}

error_page 502 503 504 /50x.html;
location = /50x.html {
  root /usr/share/nginx/html;
  internal;
}
