# Cholo edge proxy. Site config lives in templates/<mode>/*.conf.template
# (rendered by the nginx image's envsubst entrypoint into /etc/nginx/conf.d).
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  proxy_read_timeout 60s; # per-location overrides: payments 90s, SSE streams 1h

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  charset utf-8;

  # JSON access log → promtail/Loki. request_id is forwarded to the API (x-request-id).
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer","ua":"$http_user_agent","host":"$host"}';
  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_names_hash_bucket_size 128;

  # timeouts & body limits
  client_body_timeout   15s;
  client_header_timeout 15s;
  send_timeout          30s;
  client_max_body_size  10m;   # product images / CSV imports
  large_client_header_buffers 4 16k;

  # gzip (Next already sends compressed static chunks with long cache headers)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/problem+json application/javascript
             application/xml application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  # real client IP / websocket upgrade helpers
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
  }

  # abuse protection (the API also throttles per route)
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  upstream cholo_web {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream cholo_api {
    # `docker compose up --scale api=N` → Docker DNS returns every replica
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream cholo_grafana {
    server grafana:3000;
    keepalive 8;
  }

  include /etc/nginx/conf.d/*.conf;
}
