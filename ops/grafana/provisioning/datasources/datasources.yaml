# Provisioned datasources (uids are referenced by dashboards — don't change them).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      # exemplars (from Tempo span metrics) → open the trace in Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      # trace → metrics: from a span, open request rate / latency for its route
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-10m"
        spanEndTimeShift: "10m"
        tags:
          - { key: "service.name", value: "service" }
          - { key: "http.route", value: "http_route" }
        queries:
          - name: Request rate (route)
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: p95 latency (route)
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
          - name: Use-case p95 (ms)
            query: 'histogram_quantile(0.95, sum by (le, usecase) (rate(cholo_usecase_duration_ms_bucket[5m])))'
      # trace → logs: every API log line carries trace_id (pino mixin)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="api"} | trace_id="$${__trace.traceId}"'

  # Only useful with `--profile logs`; harmless (shows "down") otherwise.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "Open trace"
