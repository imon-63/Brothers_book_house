# ════════════════════════════════════════════════════════════════════════
#  Cholo (চলো) — production-like stack
#
#    docker compose pull && docker compose up -d            # images from GHCR
#    docker compose --profile seed run --rm seed             # reference + demo data
#    docker compose --profile logs up -d                     # + Loki/Promtail
#
#  Networks
#    edge      nginx ⇄ web / api / grafana (only nginx publishes 80/443)
#    internal  postgres, prometheus, tempo, collector, loki — no published
#              ports, no internet egress
#
#  Local development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ════════════════════════════════════════════════════════════════════════
name: cholo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-image: &api-image ${API_IMAGE:-ghcr.io/cholo-shop/cholo-api}:${IMAGE_TAG:-latest}

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-cholo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cholo}?schema=public&connection_limit=${DB_POOL_SIZE:-10}
  DIRECT_URL: postgresql://${POSTGRES_USER:-cholo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cholo}?schema=public

services:
  # ───────────────────────── data ─────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cholo}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      TZ: UTC
    # Tuned for a 4 GB / 2 vCPU VPS; scale shared_buffers ≈ 25% RAM, effective_cache_size ≈ 60-75%.
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_statistics_target=100
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - statement_timeout=${PG_STATEMENT_TIMEOUT:-30s}
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-500}
      - -c
      - log_lock_waits=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
    logging: *logging

  # One-shot: apply pending Prisma migrations, then exit 0. api waits for it.
  migrate:
    image: *api-image
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      <<: *db-env
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # Optional one-shot: idempotent reference/demo data (docker compose --profile seed run --rm seed).
  seed:
    image: *api-image
    profiles: [seed]
    command: ["node", "seed/seed.js"]
    restart: "no"
    environment:
      <<: *db-env
      NODE_ENV: ${SEED_NODE_ENV:-production}
      SEED_ADMIN_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@cholo.shop}
      SEED_ADMIN_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_FORCE: ${SEED_FORCE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    logging: *logging

  # ───────────────────────── apps ─────────────────────────
  api:
    image: *api-image
    restart: unless-stopped
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      APP_VERSION: ${IMAGE_TAG:-latest}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cholo.shop}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://cholo.shop}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://cholo.shop}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (>= 32 chars) in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-testbox}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-qwerty}
      SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: cholo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROMETHEUS_PORT: 9464
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOY_ENV:-production}
      TZ: UTC
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    expose: ["4000", "9464"]
    networks: [edge, internal]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1g }
        reservations: { memory: 256m }
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/cholo-shop/cholo-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose: ["3000"]
    networks: [edge]
    depends_on:
      api:
        condition: service_started
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }
    logging: *logging

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/snippets:/etc/nginx/snippets:ro
      - ./ops/nginx/templates/${NGINX_MODE:-http}:/etc/nginx/templates:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    tmpfs:
      - /etc/nginx/conf.d # rendered from templates on start (hides the image's default.conf)
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    logging: *logging

  # ───────────────────────── observability ─────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.120.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-production}
      TRACE_SAMPLE_PCT: ${TRACE_SAMPLE_PCT:-25}
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro # hostmetrics (CPU/mem/disk/net of the docker host)
    expose: ["4317", "4318", "8889", "8888", "13133"]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    logging: *logging

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.2}
    restart: unless-stopped
    user: "0" # writes to the named volume
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    expose: ["3200", "4317", "4318"]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging: *logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.2.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.enable-remote-write-receiver # Tempo span metrics + service graph
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
    expose: ["9090"]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    logging: *logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.5.2}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-true}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_DOMAIN: ${DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cholo-api-latency.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3001}:3000" # SSH tunnel access; public access via nginx /grafana/
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [edge, internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    logging: *logging

  # ── optional log pipeline: docker compose --profile logs up -d ──
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.4.2}
    profiles: [logs]
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./ops/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    expose: ["3100"]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768m }
    logging: *logging

  promtail:
    image: grafana/promtail:${LOKI_VERSION:-3.4.2}
    profiles: [logs]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./ops/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp/positions
    depends_on: [loki]
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
    logging: *logging

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  uploads:
  prometheus:
  grafana:
  tempo:
  loki:
  promtail-positions:
  certbot-webroot:
