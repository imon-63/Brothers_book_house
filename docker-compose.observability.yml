# ════════════════════════════════════════════════════════════════════════
#  LOCAL observability only — API and web run on your machine, not in Docker.
#
#    make obs-up        (= docker compose -f docker-compose.observability.yml up -d)
#
#  host API (npm run start:dev, :4000)
#     ├─ OTLP traces+metrics → http://localhost:4318 → otel-collector → tempo
#     └─ :9464/metrics ← scraped by prometheus via host.docker.internal
#  Grafana: http://localhost:3001 (anonymous admin, dashboards pre-provisioned)
#
#  backend/.env for this mode:
#    OTEL_ENABLED=true
#    OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#    OTEL_PROMETHEUS_PORT=9464
# ════════════════════════════════════════════════════════════════════════
name: cholo-obs

x-host: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux; Docker Desktop resolves it natively

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.120.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOY_ENV: development
      TRACE_SAMPLE_PCT: 100 # keep every trace locally
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP from the host API
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:8889:8889" # collector's Prometheus exporter
    <<: *host-gateway

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.7.2}
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: 48h
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.2.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    <<: *host-gateway

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.5.2}
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceToMetrics
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cholo-api-latency.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, tempo]

volumes:
  tempo:
  prometheus:
  grafana:
